version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: snakesafe-mysql
    restart: always
    environment:
      MYSQL_DATABASE: snakesafe
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # AI Python FastAPI Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: snakesafe-ai
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  # Spring Boot Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: snakesafe-backend
    restart: always
    depends_on:
      - db
      - ai-service
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://db:3306/snakesafe?createDatabaseIfNotExist=true&useSSL=false
      - DB_USER=root
      - DB_PASSWORD=root
      - AI_SERVICE_URL=http://ai-service:8000

  # React Frontend Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: snakesafe-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  db_data:
