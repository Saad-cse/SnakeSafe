spring.application.name=snakesafe-backend
server.port=8080

# Fallback & Production DataSource Configuration
# Can connect to MySQL if available, with automatic in-memory H2 MySQL-mode fallback
spring.datasource.url=${DB_URL:jdbc:h2:mem:snakesafe;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# AI Service Microservice URL
snakesafe.ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Logging
logging.level.com.snakesafe=INFO
logging.level.org.springframework.web=INFO
